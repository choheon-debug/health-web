<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>건강 레시피</title>
<meta name="description" content="AI가 실시간 웹 검색으로 건강 식단·음료·운동·레시피를 추천해 주는 앱">
<meta name="theme-color" content="#F3F4F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="건강 레시피">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* 보내 주신 화면 그대로: 회색 바탕, 흰 카드, 색깔별 버튼(식단 파랑·음료 초록·운동 주황 …) */
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#d1d5db; --soft:#f9fafb;
  --blue:#3b82f6; --green:#22c55e; --orange:#f97316; --pink:#ec4899; --purple:#a855f7; --yellow:#eab308;
  --indigo:#6366f1; --teal:#14b8a6; --gray:#6b7280; --danger:#dc2626;
  --shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -2px rgb(0 0 0 / .05);
  --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:28rem;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;min-height:100dvh;justify-content:center}
header{position:relative;text-align:center;padding:6px 44px}
header h1{margin:0;font-size:1.85rem;font-weight:800}
header p{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.gear{position:absolute;right:0;top:4px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgb(0 0 0 / .08);font-size:1.15rem}
.card{background:var(--card);border-radius:1.5rem;box-shadow:var(--shadow);padding:1rem}
.greet{margin:0 0 8px;text-align:center;font-weight:700}
.inp{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff}
textarea.inp{resize:none}
.inp:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgb(99 102 241 / .15)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;font-weight:700;color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.95rem;white-space:nowrap;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55}
.icon-btn{flex:none;width:44px;height:42px;padding:0;font-size:1.1rem}
.b-blue{background:var(--blue)}.b-green{background:var(--green)}.b-orange{background:var(--orange)}.b-pink{background:var(--pink)}.b-purple{background:var(--purple)}
.b-yellow{background:var(--yellow)}.b-indigo{background:var(--indigo)}.b-teal{background:var(--teal)}.b-gray{background:var(--gray)}
.full{width:100%;margin-top:8px}
.keynote{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:11px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center}
.keynote p{margin:0;flex:1;line-height:1.45}
.keynote button{flex:none;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:700;padding:8px 12px}

/* 결과 창 */
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .5);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
.sheet{background:#fff;border-radius:18px;box-shadow:0 20px 40px rgb(0 0 0 / .25);width:100%;max-width:34rem;max-height:92dvh;display:flex;flex-direction:column;padding:14px 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid #e5e7eb;padding-bottom:8px;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:1.1rem;color:#3730a3;line-height:1.4;overflow-wrap:anywhere}
.x{border:0;background:none;font-size:1.9rem;line-height:1;color:var(--muted);padding:0 4px}
.body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;font-size:.95rem;line-height:1.7;color:#374151;user-select:text;-webkit-user-select:text;padding-right:4px;overflow-wrap:anywhere}
.body h4{margin:16px 0 6px;font-size:1rem;border-bottom:1px solid #e5e7eb;padding-bottom:4px}
.body h4.g{color:#15803d}.body h4.b{color:#1d4ed8}.body h4.o{color:#c2410c}
.body h5{margin:12px 0 4px;font-size:.98rem}
.body p{margin:0 0 10px}
.body ul,.body ol{margin:4px 0 10px;padding-left:1.3em}
.body li{margin:2px 0}
.body table{width:100%;border-collapse:collapse;font-size:.82rem}
.body th,.body td{border-bottom:1px solid #e5e7eb;padding:7px 6px;text-align:left;vertical-align:top}
.body thead th{background:#f3f4f6;color:#374151}
.body tbody th{white-space:nowrap;color:#111827}
.tbl{overflow-x:auto}
.kw-f{color:#ea580c;font-weight:700}.kw-n{color:#16a34a;font-weight:700}.kw-h{color:#2563eb;font-weight:700}.kw-c{color:#dc2626;font-weight:700}.kw-p{color:#9333ea;font-weight:700}
.sources{margin-top:12px;padding-top:10px;border-top:1px dashed #e5e7eb;font-size:.8rem}
.sources b{display:block;color:var(--muted);margin-bottom:4px}
.sources a{display:block;color:#2563eb;text-decoration:none;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caution{margin-top:10px;font-size:.78rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 10px;line-height:1.5}
.sheet-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;border-top:1px solid #e5e7eb;margin-top:10px;padding-top:10px}
.sheet-foot .btn{font-size:.82rem;padding:8px 11px}
.spinner{width:48px;height:48px;border:4px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.loading{text-align:center;padding:36px 0;color:var(--muted)}
.loading p{margin-top:14px}
.writing{color:var(--muted);font-size:.85rem;margin-top:10px}
.loading .wait{margin-top:6px;font-size:.85rem;opacity:.8;min-height:1.2em}
.err{color:var(--danger);white-space:pre-line;word-break:break-word}
.hist{border-bottom:1px solid #e5e7eb;padding:10px 0;display:flex;gap:10px;align-items:center}
.hist button.open{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0}
.hist .q{font-weight:700;color:#7e22ce;display:block;overflow-wrap:anywhere}
.hist .d{font-size:.78rem;color:var(--muted)}
.hist .del{flex:none;border:0;background:#f3f4f6;border-radius:8px;padding:6px 9px;color:var(--muted);font-size:.8rem}

/* 설정 */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.92rem}
.field small{color:var(--muted);font-size:.8rem;line-height:1.5}
.field summary{cursor:pointer;padding:4px 0}
.steps{margin:6px 0 0;padding-left:1.3em;font-size:.88rem;line-height:1.7}
.steps a{color:#2563eb}
.ok{color:#15803d}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:12px;padding:11px 16px;font-size:.9rem;z-index:80;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>🍎 건강 레시피 👨‍🍳</h1>
    <p>실시간 웹 &amp; 이미지 검색 기반</p>
    <button class="gear" id="btnSettings" aria-label="설정">⚙</button>
  </header>

  <div class="keynote" id="keyNote" hidden>
    <p>AI 서버를 준비하고 있어요. 그동안은 ⚙ 설정에서 내 Gemini API 키를 넣으면 쓸 수 있어요.</p>
    <button type="button" id="keyNoteBtn">설정</button>
  </div>

  <section class="card">
    <h2 class="greet" id="greet"></h2>
    <input class="inp" id="condition" placeholder="질병/고민 입력 (예: 당뇨)" autocomplete="off">
    <div class="grid3">
      <button class="btn b-blue" data-rec="food">🥗 식단</button>
      <button class="btn b-green" data-rec="drink">🥤 음료</button>
      <button class="btn b-orange" data-rec="exercise">🏃 운동</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <input class="inp" id="search" placeholder="음식, 식재료 검색" autocomplete="off" enterkeyhint="search">
      <input type="file" id="photo" accept="image/*" hidden>
      <button class="btn b-pink icon-btn" id="btnPhoto" aria-label="사진으로 찾기">📷</button>
      <button class="btn b-purple icon-btn" id="btnSearch" aria-label="검색">🔍</button>
    </div>
    <button class="btn b-yellow full" id="btnPlaces">📍 입력한 음식으로 주변 맛집 찾기</button>
  </section>

  <section class="card">
    <div class="row">
      <input class="inp" id="weekly" placeholder="식단 관리 항목 (예: 간경화)" autocomplete="off" enterkeyhint="go">
      <button class="btn b-indigo" id="btnWeekly">주간 식단 짜기</button>
    </div>
  </section>

  <section class="card">
    <textarea class="inp" id="qa" rows="2" placeholder="궁금한 점을 질문하세요."></textarea>
    <div class="grid2">
      <button class="btn b-teal" id="btnAsk">💬 질문하기</button>
      <button class="btn b-gray" id="btnHistory">🕘 다시보기</button>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet-head"><h3 id="mTitle"></h3><button class="x" id="mClose" aria-label="닫기">×</button></div>
    <div class="body" id="mBody"></div>
    <div class="sheet-foot" id="mFoot">
      <button class="btn b-yellow" id="mPlaces" hidden>📍 주변 맛집 추천</button>
      <button class="btn b-gray" id="mCopy">📋 내용 복사</button>
      <button class="btn b-indigo" id="mShare">📤 보내기</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
// AI 중계 서버 주소 (Cloudflare Worker). 여기로 보내면 서버에 숨겨 둔 키로 답을 받아 오므로, 쓰는 사람은 키가 필요 없다.
const PROXY_URL = "https://health-ai.choheon.workers.dev/";
const API = "https://generativelanguage.googleapis.com/v1beta";
const SYSTEM = "당신은 20년 경력의 세계적인 건강식단 연구가이자 식품영양학 박사이며, 미슐랭급 셰프입니다. 모든 답변은 한국어로, 전문가의 입장에서 친절하고 상세하게 제공해야 합니다. 질병이 있는 사람에게는 주의할 점도 함께 알려 주세요.";
const CAUTION = "※ 일반적인 건강 정보예요. 질환이 있거나 약을 드시는 중이면 의사·영양사와 먼저 상의하세요.";

/* ---------- 저장 (이 휴대폰에만) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const settings = () => {
  const s = store.get("health.settings", { key: "", model: "", region: "전라남도 목포시" });
  if (s.model === "gemini-2.5-flash") s.model = "";   // 예전 기본값(없어진 모델)은 자동 선택으로
  return s;
};
/** 키를 넣었거나 중계 서버가 있으면 AI를 쓸 수 있다 */
const aiReady = () => !!(settings().key || PROXY_URL);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
function toast(t) {
  document.querySelector(".toast")?.remove();
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2800);
}

/* ---------- 계절 · 다음 식사 ---------- */
const season = () => { const m = new Date().getMonth() + 1; return m >= 3 && m <= 5 ? "봄" : m <= 8 && m >= 6 ? "여름" : m >= 9 && m <= 11 ? "가을" : "겨울"; };
const nextMeal = () => { const h = new Date().getHours(); return h >= 8 && h < 12 ? "점심" : h >= 12 && h < 18 ? "저녁" : "아침"; };

/* ---------- Gemini 호출 ---------- */
class AppError extends Error {}
/** AI에게 묻는다. onText를 주면 답이 오는 대로 조금씩 알려 준다(스트리밍). */
async function gemini(prompt, { image = null, search = true, onText = null } = {}) {
  const s = settings();
  if (s.key) return direct(s, prompt, image, search, onText);   // 설정에 자기 키를 넣었으면 그 키로 바로
  if (!PROXY_URL) throw new AppError("AI 서버가 아직 연결되지 않았어요. 관리자에게 알려 주세요.");
  let res;
  try {
    res = await fetch(PROXY_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, image, search, stream: true }) });
  } catch (e) { throw new AppError("AI 서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요."); }
  if (res.ok && /event-stream/.test(res.headers.get("Content-Type") || "")) return readStream(res, onText);
  const j = await res.json().catch(() => null);
  if (!j) throw new AppError("AI 서버가 아직 준비되지 않았어요. 잠시 뒤에 다시 해 주세요.");   // 서버 코드가 아직 안 들어갔을 때
  if (!res.ok || !j.text) throw new AppError((j.error || `AI 서버 요청이 실패했어요 (${res.status}).`) + (j.detail ? `\n(원인: ${j.detail})` : ""));
  onText?.(j.text);
  return { text: j.text, sources: j.sources || [] };
}
/** 구글이 조금씩 보내는 답(SSE)을 모아서, 올 때마다 onText로 지금까지의 글을 알려 준다 */
async function readStream(res, onText) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "", finish = "";
  const seen = new Set(), sources = [];
  const take = line => {
    if (!line.startsWith("data:")) return;
    let j; try { j = JSON.parse(line.slice(5)); } catch (e) { return; }
    const c = j.candidates?.[0];
    if (!c) return;
    const add = (c.content?.parts || []).filter(x => !x.thought).map(x => x.text || "").join("");
    if (add) { text += add; onText?.(text); }
    if (c.finishReason) finish = c.finishReason;
    for (const g of c.groundingMetadata?.groundingChunks || []) {
      if (g.web?.uri && !seen.has(g.web.uri)) { seen.add(g.web.uri); sources.push({ uri: g.web.uri, title: g.web.title || g.web.uri }); }
    }
  };
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split(/\r?\n/); buf = lines.pop();
      lines.forEach(take);
    }
    take(buf);
  } catch (e) { if (!text) throw new AppError("답을 받다가 연결이 끊겼어요. 다시 해 주세요."); }
  text = text.trim();
  if (!text) throw new AppError(finish === "SAFETY" ? "이 질문에는 답할 수 없다고 해요. 다르게 물어봐 주세요." : "AI가 답을 주지 않았어요. 다시 해 주세요.");
  return { text, sources: sources.slice(0, 6) };
}
let autoModel = "";
/** 지금 쓸 수 있는 Flash 모델 중 가장 새 것을 고른다 (구글이 옛 모델을 없애도 저절로 따라간다) */
async function pickModel(key) {
  try {
    const j = await (await fetch(`${API}/models?pageSize=200`, { headers: { "x-goog-api-key": key } })).json();
    const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, ""));
    if (names.includes("gemini-flash-latest")) return "gemini-flash-latest";
    const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0);
    const flash = names.filter(n => /^gemini-[\d.]+-flash(-\d+)?$/.test(n)).sort((a, b) => ver(b) - ver(a) || a.length - b.length);
    if (flash.length) return flash[0];
  } catch (e) {}
  return "gemini-flash-latest";
}
async function direct(s, prompt, image, search, onText) {
  const parts = [{ text: prompt }];
  if (image) parts.push({ inlineData: { mimeType: image.type, data: image.data } });
  const body = { systemInstruction: { parts: [{ text: SYSTEM }] }, contents: [{ role: "user", parts }] };
  if (search) body.tools = [{ google_search: {} }];   // 실시간 웹 검색
  for (let attempt = 0; attempt < 2; attempt++) {
    const model = s.model || autoModel || (autoModel = await pickModel(s.key));
    let res;
    try {
      res = await fetch(`${API}/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`, {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": s.key }, body: JSON.stringify(body),
      });
    } catch (e) { throw new AppError("인터넷에 연결되어 있는지 확인해 주세요."); }
    if (res.status === 404 && !s.model && attempt === 0) { autoModel = ""; continue; }   // 모델이 없어졌으면 다시 고른다
    if (!res.ok) {
      const detail = await res.text().catch(() => "");
      if (res.status === 400 && /API key|API_KEY/i.test(detail)) throw new AppError("API 키가 맞지 않아요. ⚙ 설정에서 키를 확인해 주세요.");
      if (res.status === 403) throw new AppError("이 API 키로는 쓸 수 없어요. ⚙ 설정에서 키를 확인해 주세요.");
      if (res.status === 404) throw new AppError(`AI 모델 '${model}'을 찾을 수 없어요. ⚙ 설정의 모델 칸을 비워 두면 자동으로 골라요.`);
      if (res.status === 429) throw new AppError("무료 사용량을 잠시 넘었어요. 1~2분 뒤에 다시 해 주세요.");
      if (res.status >= 500) throw new AppError("AI 서버가 잠시 바빠요. 잠시 뒤에 다시 해 주세요.");
      throw new AppError(`요청이 실패했어요 (${res.status}).`);
    }
    return readStream(res, onText);
  }
  throw new AppError("쓸 수 있는 AI 모델을 찾지 못했어요.");
}
/** 답 안의 JSON을 꺼낸다 (```json … ``` 이나 맨 앞 { 부터 맨 뒤 } 까지) */
function pickJson(text) {
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const raw = m ? m[1] : text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1);
  try { return JSON.parse(raw); } catch (e) { return null; }
}

/* ---------- 글 → 화면 (먼저 안전하게 바꾼 뒤 굵은 글씨·목록만 살린다) ---------- */
function mdToHtml(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const line of text.split(/\r?\n/)) {
    const t = line.trim();
    if (!t) { close(); continue; }
    let m;
    if ((m = t.match(/^##\s+(.*)/))) { close(); out.push(`<h4 class="${/영양/.test(m[1]) ? "g" : /주의/.test(m[1]) ? "o" : "b"}">${inline(m[1])}</h4>`); continue; }
    if ((m = t.match(/^#{1,6}\s+(.*)/))) { close(); out.push(`<h5>${inline(m[1])}</h5>`); continue; }
    if ((m = t.match(/^[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = t.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(t)}</p>`);
  }
  close();
  return out.join("");
}
function weeklyHtml(d) {
  const days = ["월요일", "화요일", "수요일", "목요일", "금요일", "토요일", "일요일"];
  let t = `<div class="tbl"><table><thead><tr><th>요일</th><th>아침</th><th>점심</th><th>저녁</th></tr></thead><tbody>`;
  for (const day of days) { const m = d[day] || {}; t += `<tr><th>${day}</th><td>${esc(m.아침 || "-")}</td><td>${esc(m.점심 || "-")}</td><td>${esc(m.저녁 || "-")}</td></tr>`; }
  t += "</tbody></table></div>";
  if (d.tips) t += `<h4 class="g">식단 관리 요령</h4>${mdToHtml(Array.isArray(d.tips) ? d.tips.map(x => "- " + x).join("\n") : d.tips)}`;
  return t;
}
/* 중요한 낱말에 색 입히기 (태그 안은 건드리지 않게 글자 부분만) */
const KEYWORDS = [
  ["kw-f", ["단호박", "연어", "닭가슴살", "귀리", "채소", "과일", "고구마", "시금치", "브로콜리", "버섯", "블루베리", "라즈베리", "두부", "견과류", "생선"]],
  ["kw-n", ["비타민 A", "비타민 C", "비타민", "식이섬유", "베타글루칸", "단백질", "오메가-3", "지방산", "항산화", "미네랄", "칼륨", "철분"]],
  ["kw-h", ["혈당 조절", "인슐린", "심혈관 건강", "포만감", "근육량", "다이어트", "면역력", "피로 회복", "당뇨", "고혈압"]],
  ["kw-c", ["굽는", "찌는", "삶는", "볶는", "튀기는", "끓이는"]],
  ["kw-p", ["한정식", "카페", "브런치", "맛집", "음식점"]],
];
const KW_RE = new RegExp(KEYWORDS.flatMap(([, w]) => w).sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
const KW_CLASS = Object.fromEntries(KEYWORDS.flatMap(([c, ws]) => ws.map(w => [w, c])));
function highlight(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    if (n.parentElement.closest("a,th")) continue;
    const t = n.nodeValue; KW_RE.lastIndex = 0;
    if (!KW_RE.test(t)) continue;
    const span = document.createElement("span");
    span.innerHTML = esc(t).replace(KW_RE, w => `<span class="${KW_CLASS[w]}">${w}</span>`);
    n.replaceWith(...span.childNodes);
  }
}

let busy = false, lastPlacesFood = null;

const closeModal = () => { $("#modal").hidden = true; };
let loadTimer = 0, loadExtra = "";
/** 기다리는 동안 몇 초 지났는지와 단계별 안내를 보여 준다 (멈춘 게 아니라는 걸 알 수 있게) */
function loading(msg) {
  openModal("정보 검색 중", `<div class="loading"><div class="spinner"></div><p>${esc(msg)}</p><p class="wait" id="waitText"></p></div>`, { caution: false, tools: false });
  const t0 = Date.now();
  clearInterval(loadTimer); loadExtra = "";
  loadTimer = setInterval(() => {
    const el = $("#waitText"), sec = Math.round((Date.now() - t0) / 1000);
    if (!el) { clearInterval(loadTimer); return; }
    el.textContent = loadExtra ? `${sec}초 · ${loadExtra}` : `${sec}초 ${sec < 8 ? "· 웹에서 자료를 찾고 있어요" : sec < 20 ? "· 찾은 자료로 답을 쓰고 있어요" : "· 거의 다 됐어요, 조금만 기다려 주세요"}`;
  }, 1000);
}

};

/* ---------- 공통 실행 틀: 로딩 → AI → 결과 → 기록 ---------- */
/** 답이 오는 동안 지금까지 쓴 글을 바로 보여 준다 (너무 자주 그리지 않게 0.2초마다) */
let liveAt = 0, liveT0 = 0;
function live(title, html) {
  const now = Date.now();
  if (now - liveAt < 200) return;
  liveAt = now; clearInterval(loadTimer);
  $("#mTitle").textContent = title;
  $("#mBody").innerHTML = html + `<p class="writing">✍️ 답을 쓰는 중… ${Math.round((now - liveT0) / 1000)}초</p>`;
  $("#mPlaces").hidden = true; $("#mFoot").hidden = true;
}
async function run(label, msg, task) {
  if (busy) return;
  if (!aiReady()) { openSettings(); toast("AI 서버가 아직 연결되지 않았어요"); return; }
  busy = true; document.querySelectorAll(".btn").forEach(b => b.disabled = true);
  loading(msg); liveT0 = Date.now(); liveAt = 0;
  try {
    const r = await task();
    openModal(r.title, r.html, { sources: r.sources, food: r.food, caution: r.caution !== false });
    addHistory(label, r);
  } catch (e) {
    console.error(e);
    openModal("앗, 잘 안 됐어요", `<p class="err">${esc(e instanceof AppError ? e.message : "알 수 없는 문제가 생겼어요. 다시 해 주세요.")}</p>`, { caution: false, tools: false });
  } finally { clearInterval(loadTimer); busy = false; document.querySelectorAll(".btn").forEach(b => b.disabled = false); }
}
// 답을 쓰는 대로 바로 보여 줄 수 있게 JSON 대신 정해진 제목의 글로 받는다. 빨리 끝나도록 간결하게.
const FOOD_FMT = `아래 형식 그대로, 간결하게 답하세요. 표와 JSON은 쓰지 마세요.
# 메뉴 이름
추천 이유와 간단한 설명 (2~3문장)
## 1. 주요 영양성분
- 영양소: 효과 (3~4개)
## 2. 추천 레시피
### 레시피 제목
1. 조리 단계 (레시피마다 5단계 이내)
## 3. 주의할 점
이 질환이 있는 사람이 주의할 점 (없으면 이 부분은 빼세요)`;
/** "# 메뉴 이름" 줄을 제목으로 쓰고, 나머지를 화면용으로 바꾼다 */
function foodView(text, titlePrefix, fallbackName) {
  const m = text.match(/^\s*#\s+(.+)$/m);
  const name = m ? m[1].replace(/\*\*/g, "").trim() : fallbackName;
  const body = m ? text.replace(m[0], "") : text;
  return { title: `${titlePrefix}${name || ""}`, html: mdToHtml(body), food: name || fallbackName };
}
async function foodTask(prompt, titlePrefix, fallbackName, opts) {
  const { text, sources } = await gemini(prompt, { ...opts, onText: t => { const v = foodView(t, titlePrefix, fallbackName); live(v.title, v.html); } });
  return { ...foodView(text, titlePrefix, fallbackName), sources };
}

/** 사진이 크면 1280px로 줄여서 보낸다 (빠르고 데이터도 덜 든다) */
function shrinkImage(file) {
  return new Promise(resolve => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve({ type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85).split(",")[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); const fr = new FileReader(); fr.onload = () => resolve({ type: file.type || "image/jpeg", data: fr.result.split(",")[1] }); fr.readAsDataURL(file); };
    img.src = url;
  });
}
const here = () => new Promise(resolve => {
  if (!navigator.geolocation) return resolve(null);
  navigator.geolocation.getCurrentPosition(p => resolve(p.coords), () => resolve(null), { timeout: 8000, maximumAge: 600000 });
});

### 반경 60km 이내 (최대 5곳)

### 반경 100~200km (최대 5곳)
각 맛집은 번호를 매기고 아래처럼 쓰세요. 표는 쓰지 마세요. 확인되지 않은 전화번호는 쓰지 마세요.

- 가격대: …
- 특징: …`, { onText: t => live(`'${food}' 주변 맛집 찾는 중`, mdToHtml(t)) });
    return { title: `'${food}' 주변 맛집 추천${c ? "" : ` (${region} 기준)`}`, html: mdToHtml(text) + (c ? "" : `<p class="caution">위치 권한이 없어 ⚙ 설정의 기본 지역(${esc(region)})으로 찾았어요.</p>`), sources, caution: false };
  });
}

const HKEY = "health.history.v1";
function addHistory(q, r) {
  const list = store.get(HKEY, []);
  list.unshift({ id: Date.now(), q, title: r.title, html: r.html, sources: r.sources || [], food: r.food || null, caution: r.caution !== false, at: new Date().toISOString() });
  store.set(HKEY, list.slice(0, 30));
}
function showHistory() {
  const list = store.get(HKEY, []);
  if (!list.length) { openModal("다시보기", "<p>아직 기록이 없어요.</p>", { caution: false, tools: false }); return; }
  openModal(`다시보기 (최근 ${list.length}개)`, list.map(it => {
    const d = new Date(it.at);
    return `<div class="hist" data-id="${it.id}"><button type="button" class="open"><span class="q">${esc(it.q)}</span><span class="d">${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}</span></button><button type="button" class="del">삭제</button></div>`;
  }).join(""), { caution: false, tools: false });
}
$("#btnHistory").onclick = showHistory;
$("#mBody").addEventListener("click", e => {
  const row = e.target.closest(".hist"); if (!row) return;
  const list = store.get(HKEY, []), it = list.find(x => x.id === +row.dataset.id); if (!it) return;
  if (e.target.closest(".open")) openModal(it.title, it.html, { sources: it.sources, food: it.food, caution: it.caution });
  if (e.target.closest(".del")) { store.set(HKEY, list.filter(x => x.id !== it.id)); showHistory(); toast("삭제했어요"); }
});

  openModal("⚙ 설정", `
    <div class="field"><label for="sRegion">맛집 검색 기본 지역</label>
      <input class="inp" id="sRegion" value="${esc(s.region)}" placeholder="예: 전라남도 목포시">
      <small>위치 권한을 허용하지 않았을 때 이 지역을 기준으로 찾아요.</small></div>
    <details class="field" ${s.key || !PROXY_URL ? "open" : ""}><summary><b>고급: 내 API 키 직접 쓰기 (선택)</b></summary>
      <small>${PROXY_URL ? "키 없이도 AI를 쓸 수 있어요. 내 키를 넣으면 그 키로 바로 질문해요." : "AI 서버를 준비하는 동안에는 여기에 내 키를 넣으면 쓸 수 있어요."}</small>
      <div class="row" style="margin-top:6px"><input class="inp" id="sKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…로 시작하는 키 (비워 두면 AI 서버 사용)" value="${esc(s.key)}">
      <button type="button" class="btn b-gray icon-btn" id="sShow" aria-label="키 보기">👁</button></div>
      <small>키는 이 휴대폰에만 저장돼요. 키 받기: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></small>
      <label for="sModel" style="margin-top:8px">AI 모델</label>
      <input class="inp" id="sModel" value="${esc(s.model)}" autocomplete="off" spellcheck="false" placeholder="비워 두면 자동으로 골라요">
    </details>
    <p id="sMsg" role="status"></p>
    <div class="grid2"><button type="button" class="btn b-indigo" id="sSave">저장</button><button type="button" class="btn b-teal" id="sTest">연결 확인</button></div>
    <div class="grid2"><button type="button" class="btn b-gray" id="sClearHist">기록 모두 지우기</button><button type="button" class="btn b-gray" id="sClearKey">키 지우기</button></div>`, { caution: false, tools: false });
  $("#mTitle").textContent = "⚙ 설정";
  const save = () => {
    const v = { key: $("#sKey").value.trim(), model: $("#sModel").value.trim(), region: $("#sRegion").value.trim() || "전라남도 목포시" };
    store.set("health.settings", v); refreshKeyNote(); return v;
  };
  $("#sShow").onclick = () => { const i = $("#sKey"); i.type = i.type === "password" ? "text" : "password"; };
  $("#sSave").onclick = () => { save(); toast("저장했어요"); closeModal(); };
  $("#sTest").onclick = async () => {
    const v = save(), msg = $("#sMsg");
    if (!v.key && !PROXY_URL) { msg.className = "err"; msg.textContent = "AI 서버가 아직 없어요. 내 키를 넣고 확인해 주세요."; return; }
    msg.className = ""; msg.textContent = "확인하는 중…";
    try { await gemini("'연결 성공'이라고만 답하세요.", { search: false }); msg.className = "ok"; msg.textContent = "✅ 연결됐어요! 이제 모든 기능을 쓸 수 있어요."; }
    catch (e) { msg.className = "err"; msg.textContent = e instanceof AppError ? e.message : "확인하지 못했어요."; }
  };
  let sure = false;
  $("#sClearHist").onclick = e => {
    if (!sure) { sure = true; e.target.textContent = "정말 지우기"; return; }
    store.set(HKEY, []); toast("기록을 모두 지웠어요"); e.target.textContent = "기록 모두 지우기"; sure = false;
  };
  $("#sClearKey").onclick = () => { $("#sKey").value = ""; save(); toast("키를 지웠어요"); };
}
$("#btnSettings").onclick = openSettings;
$("#keyNoteBtn").onclick = openSettings;
const refreshKeyNote = () => { $("#keyNote").hidden = aiReady(); };

/* ---------- 시작 ---------- */
$("#greet").textContent = `🌿 지금은 ${season()}, 다음 식사는 ${nextMeal()}이에요.`;
refreshKeyNote();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
